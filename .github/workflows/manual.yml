name: Compile Digital Tripwire CYD 

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. ดึงโค้ดโปรเจกต์จาก Repository ของคุณ
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. แตกไฟล์ Zip ของ TFT_eSPI ไปไว้ในตำแหน่งที่ Arduino CLI จะเรียกใช้งาน
      - name: Setup Custom TFT_eSPI Library
        run: |
          mkdir -p $HOME/Arduino/libraries
          if [ -f "./TFT_eSPI.zip" ]; then
            unzip ./TFT_eSPI.zip -d $HOME/Arduino/libraries/
            echo "Custom TFT_eSPI library unzipped and configured successfully."
          else
            echo "Error: TFT_eSPI.zip not found in root directory! Please upload TFT_eSPI.zip first."
            exit 1
          fi

      # 3. คอมไพล์โค้ดบอร์ด ESP32 CYD ผ่าน Arduino CLI
      - name: Compile Arduino Sketch for ESP32 CYD
        uses: arduino/compile-sketches@v1
        with:
          # ระบุค่าบอร์ดและคอนฟิกฮาร์ดแวร์สำหรับบอร์ด CYD (ESP32-2432S028R)
          fqbn: "esp32:esp32:esp32:JTAGAdapter=default,PSRAM=disabled,FlashMode=qio,FlashSize=4M,LoopCore=1,EventsCore=1,USBMode=default,CDCOnBoot=default,MSCOnBoot=default,DFUOnBoot=default,UploadSpeed=921600,EraseFlash=none,PartitionScheme=default,CPUFreq=240,FlashFreq=80"
          
          # ลิงก์ดาวน์โหลดแพ็กเกจแกนหลักของบอร์ดตระกูล ESP32
          platforms: |
            - name: "esp32:esp32"
              source-url: "https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json"
          
          # ติดตั้ง Library อื่นๆ ที่จำเป็น (ส่วน TFT_eSPI ระบบจะดึงจากโฟลเดอร์ที่เราแตก Zip ไว้ข้างต้น)
          libraries: |
            - name: "XPT2046_Touchscreen"
            - name: "SimpleList"
          
          # ระบุตำแหน่งโฟลเดอร์โค้ด .ino ของโปรเจกต์ และโฟลเดอร์ Library ที่เราเตรียมไว้
          sketch-paths: |
            - ./tripwire_x_cyd
          cli-compile-flags: |
            --library /home/runner/Arduino/libraries/TFT_eSPI
            
          enable-deltas-report: true
