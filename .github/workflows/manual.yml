name: Compile Digital Tripwire CYD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build CYD-2432S028
    runs-on: ubuntu-latest

    steps:
      # 1. ดึงโค้ดโปรเจกต์จาก Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. ตั้งค่า Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. แคชระบบ PlatformIO เพื่อให้บิลด์รอบต่อไปเร็วขึ้น
      - name: Cache PlatformIO Framework
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      # 4. ติดตั้ง PlatformIO และ Toolchain ที่จำเป็น
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # 5. สั่งคอมไพล์ผ่าน PlatformIO (เลือกบอร์ด CYD)
      - name: Run Compile
        run: |
          platformio run -e CYD-2432S028

      # 6. เก็บไฟล์ .bin ที่คอมไพล์เสร็จแล้วออกมาเป็น Artifact
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tripwire-CYD-2432S028
          path: .pio/build/CYD-2432S028/firmware.bin
          retention-days: 7
          if-no-files-found: warn
