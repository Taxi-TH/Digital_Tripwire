name: Compile Digital Tripwire CYD with Zip Library

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. ดึงโค้ดโปรเจกต์จาก Repository ของคุณ
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. จัดเตรียมโฟลเดอร์ Libraries และดึง SimpleList / TFT_eSPI
      - name: Setup Custom Libraries
        run: |
          mkdir -p $HOME/Arduino/libraries
          
          # ติดตั้ง TFT_eSPI จากไฟล์ Zip
          if [ -f "./TFT_eSPI.zip" ]; then
            unzip ./TFT_eSPI.zip -d $HOME/Arduino/libraries/
            echo "Custom TFT_eSPI library unzipped successfully."
          else
            echo "Error: TFT_eSPI.zip not found in root directory!"
            exit 1
          fi

          # ติดตั้ง SimpleList โดย clone เข้าโฟลเดอร์ libraries
          git clone https://github.com/blackhack/SimpleList $HOME/Arduino/libraries/SimpleList || true

      # 3. คอมไพล์โค้ดบอร์ด ESP32 CYD ผ่าน Arduino CLI
      - name: Compile Arduino Sketch for ESP32 CYD
        uses: arduino/compile-sketches@v1
        with:
          # FQBN ที่ย่อสั้นลงเพื่อแก้ปัญหา File name too long
          fqbn: "esp32:esp32:esp32:PSRAM=disabled,FlashMode=qio,FlashSize=4M,PartitionScheme=default,CPUFreq=240"
          
          # ลิงก์ดาวน์โหลดแพ็กเกจแกนหลักของบอร์ดตระกูล ESP32
          platforms: |
            - name: "esp32:esp32"
              source-url: "https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json"
          
          # ติดตั้ง Library อื่นๆ ที่มีใน Library Manager
          libraries: |
            - name: "XPT2046_Touchscreen"
          
          # ระบุตำแหน่งโฟลเดอร์โค้ด .ino และโฟลเดอร์ Library
          sketch-paths: |
            - ./tripwire_x_cyd
          cli-compile-flags: |
            --library /home/runner/Arduino/libraries
            
          enable-deltas-report: true- name: Setup Go environment
  uses: actions/setup-go@v7.0.0
  with:
    # The Go version to download (if necessary) and use. Supports semver spec and ranges. Be sure to enclose this option in single quotation marks.
    go-version: # optional
    # Path to the go.mod, go.work, .go-version, or .tool-versions file.
    go-version-file: # optional
    # Set this option to true if you want the action to always check for the latest available version that satisfies the version spec
    check-latest: # optional
    # Used to pull Go distributions from go-versions. Since there's a default, this is typically not supplied by the user. When running this action on github.com, the default value is sufficient. When running on GHES, you can pass a personal access token for github.com if you are experiencing rate limiting.
    token: # optional, default is ${{ github.server_url == 'https://github.com' && github.token || '' }}
    # Used to specify whether caching is needed. Set to true, if you'd like to enable caching.
    cache: # optional, default is true
    # Used to specify the path to a dependency file (e.g., go.mod, go.sum)
    cache-dependency-path: # optional
    # Target architecture for Go to use. Examples: x86, x64. Will use system architecture by default.
    architecture: # optional
    # Custom base URL for downloading Go distributions. Use this to download Go from a mirror or custom source. Defaults to "https://go.dev/dl". Can also be set via the GO_DOWNLOAD_BASE_URL environment variable. The input takes precedence over the environment variable.
    go-download-base-url: # optional
          
